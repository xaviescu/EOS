name: Hockey sync

on:
  schedule:
    - cron: '7 */2 * * *'   # cada 2 horas
  workflow_dispatch: {}      # también se puede lanzar a mano (pestaña Actions -> Hockey sync -> Run workflow)

permissions:
  contents: write

concurrency:
  group: hockey-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Leer resultados y clasificaciones
        id: fetch
        run: node scripts/hockey-sync.mjs
        continue-on-error: true

      - name: Guardar si ha cambiado
        run: |
          git config user.name "hockey-sync"
          git config user.email "hockey-sync@users.noreply.github.com"
          git add hockey-data.json || true
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "hockey data"
            git push
          fi

      - name: Marcar error si no se pudo leer ninguna liga
        if: steps.fetch.outcome == 'failure'
        run: exit 1
